# Dual-audit demo mandate: one systematic pod, pead only (a quant model —
# no LLM, no API key). The point is the audit chains, not the alpha.
schema_version: 2
name: dual-audit-demo
strategies:
  - name: pead-pod
    blend: {mode: long_only}
    weight: 1.0
    models:
      - name: pead
risk:
  max_position_pct: 0.30
  max_gross_exposure: 1.0
  halve_drawdown_pct: 0.10
  max_drawdown_pct: 0.20
capital: 100000
rebalance: daily
benchmark: DEMOBENCH
